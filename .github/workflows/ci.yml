name: CI

# Gates pull requests and pushes to the default branch (PRD 11.5).
# No secrets and no production credentials are used here. The build needs none: the server
# validates its environment at startup, not at build time.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Environment naming guard
        run: npm run check:env

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Client bundle secret scan
        run: npm run check:bundle

  # The database, RLS and API suites (P-11). A throwaway Supabase stack runs inside this job (Docker is on the runner):
  # nothing here can reach a hosted project, and no secret is read. The keys the tests use are the ones the local CLI prints
  # for its own disposable stack. A broken policy fails `test:db` (the pgTAP suites) or `test:integration` (real HTTP).
  database:
    name: Database, RLS and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Start the local Supabase stack
        run: npm run db:start

      - name: pgTAP tests (RLS, grants, definer functions)
        run: npm run test:db

      - name: Build (the integration tests start the production build)
        run: npm run build

      - name: API integration tests (real HTTP against the local stack)
        run: npm run test:integration

      - name: Local stack logs on failure
        if: failure()
        run: docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Stop the stack
        if: always()
        run: npm run db:stop -- --no-backup

  # The browser suite (P-12). Playwright drives the PRODUCTION BUILD against a throwaway local Supabase stack started inside the
  # job (its own mail catcher included, which the sign-up scenario needs to read the confirmation e-mail). Nothing here reads a
  # secret or reaches a hosted project: `scripts/e2e.mjs` refuses any Supabase host but 127.0.0.1 / localhost, and the
  # workflow guard test (src/lib/ci-workflow.test.ts) fails if a secret or a hosted address ever appears in this file.
  # Traces of failed tests and the server log (which the run scans for leaks) are kept as artifacts for a week.
  e2e:
    name: Browser end-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the local Supabase stack
        run: npm run db:start

      - name: Playwright (builds the app first; scans the server log for leaks when it finishes)
        run: npm run test:e2e

      - name: Keep traces and the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            .e2e-output.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: npm run db:stop -- --no-backup
