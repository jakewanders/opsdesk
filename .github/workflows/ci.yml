name: CI

# Gates pull requests and pushes to the default branch (PRD 11.5).
# No secrets and no production credentials are used here. The build needs none: the server
# validates its environment at startup, not at build time.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Environment naming guard
        run: npm run check:env

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Client bundle secret scan
        run: npm run check:bundle

  # The database, RLS and API suites (P-11). A throwaway Supabase stack runs inside this job (Docker is on the runner):
  # nothing here can reach a hosted project, and no secret is read. The keys the tests use are the ones the local CLI prints
  # for its own disposable stack. A broken policy fails `test:db` (the pgTAP suites) or `test:integration` (real HTTP).
  database:
    name: Database, RLS and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Start the local Supabase stack
        run: npm run db:start

      - name: pgTAP tests (RLS, grants, definer functions)
        run: npm run test:db

      - name: Build (the integration tests start the production build)
        run: npm run build

      - name: API integration tests (real HTTP against the local stack)
        run: npm run test:integration

      - name: Local stack logs on failure
        if: failure()
        run: docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Stop the stack
        if: always()
        run: npm run db:stop -- --no-backup

  # Added by a later issue. Kept as a comment so the required-check list stays accurate.
  #
  # e2e:        Playwright against a deploy preview or a local container with a TEST Supabase
  #             project. Never against production. (P-12)
