openapi: 3.1.0
info:
  title: OpsDesk API
  version: 0.1.0
  description: |
    Implemented routes only (a test fails when a route and this file disagree). Conventions: docs/API.md.
    All responses are `{ data, meta }` or `{ error: { code, message, fieldErrors?, requestId } }`, send
    `Cache-Control: private, no-store` and an `X-Request-Id`. Cookie session; mutations must come from the app's
    own origin (CSRF check). Tenant routes choose the workspace with the `X-Organization-Id` header.
servers:
  - url: /api/v1
paths:
  /session:
    get:
      summary: Who is calling, their workspaces, and the demo expiry for a guest
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Session" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /demo/bootstrap:
    post:
      summary: Create or return the signed-in guest's demo workspace (anonymous sessions only; sets the active workspace)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The guest's demo workspace; `created` is false when it already existed or on a replay
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [organizationId, expiresAt, created]
                    properties:
                      organizationId: { type: string, format: uuid }
                      expiresAt: { type: string, format: date-time }
                      created: { type: boolean }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A registered (non-anonymous) session (`GUEST_ONLY`) or a request from another origin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The same Idempotency-Key is still being processed (`IDEMPOTENCY_IN_PROGRESS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Malformed Idempotency-Key (`IDEMPOTENCY_KEY_INVALID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The demo is at capacity (`DEMO_CAPACITY`); `Retry-After` says when to retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /demo/reset:
    post:
      summary: Restore the signed-in guest's own demo workspace to the original sample data (once a minute; never extends the expiry)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The workspace was reset (or this is a replay of an earlier answer for the same key)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [organizationId, resetAt, expiresAt]
                    properties:
                      organizationId: { type: string, format: uuid }
                      resetAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A registered (non-anonymous) session (`GUEST_ONLY`), an expired demo (`DEMO_EXPIRED`), or a request from another origin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The guest has no demo workspace yet (`DEMO_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The same Idempotency-Key is still being processed (`IDEMPOTENCY_IN_PROGRESS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Reset less than a minute ago (`DEMO_RESET_THROTTLED`); the message says how many seconds to wait and `Retry-After` carries them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /customers:
    get:
      summary: One page of the workspace's customers (archived hidden by default)
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
            description: "Selects the workspace; required when the caller belongs to several. Always checked against membership.",
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
            description: "Over 100 is a 422, never clamped.",
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [updated_at, created_at, display_name, status],
                default: updated_at,
              },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: "Partial, case-insensitive match on display name, company and e-mail. Treated literally.",
          }
        - { name: status, in: query, schema: { type: string, enum: [lead, active, inactive] } }
        - {
            name: source,
            in: query,
            schema: { type: string, enum: [referral, website, outbound, other] },
          }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - {
            name: archived,
            in: query,
            schema: { type: string, enum: ["false", "true", all], default: "false" },
          }
      responses:
        "200":
          description: Customers with `meta.page`, `limit`, `total`, `totalPages` (a page past the end is empty with the real total)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The workspace is not one the caller belongs to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: An invalid or unknown query parameter; `error.fieldErrors` names it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Create a customer (owner, admin and member). A duplicate e-mail returns a warning, not an error.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomer" }
      responses:
        "201":
          description: The created customer. `meta.warnings` lists non-blocking problems such as `DUPLICATE_EMAIL`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Customer" }
                  meta:
                    type: object
                    properties:
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [code, message]
                          properties:
                            code: { type: string, example: DUPLICATE_EMAIL }
                            field: { type: string }
                            message: { type: string }
                            customerId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A viewer (`FORBIDDEN`) or a request from another origin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The workspace is not one the caller belongs to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failed (`fieldErrors`), or the assignee is not a member of this workspace (`INVALID_REFERENCE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The demo workspace is at its customer cap (`DEMO_CAP`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /customers/{id}:
    get:
      summary: One customer with the counts of its related records (opportunities, tasks, quotes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The customer; `data.related` has `opportunities`, `tasks` and `quotes` counts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    allOf:
                      - { $ref: "#/components/schemas/Customer" }
                      - type: object
                        properties:
                          related:
                            type: object
                            properties:
                              opportunities: { type: integer }
                              tasks: { type: integer }
                              quotes: { type: integer }
                              openOpportunities: { type: integer }
                              openTasks: { type: integer }
                  meta: { type: object }
        "400":
          {
            description: "The id is not a valid UUID",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          {
            description: "Missing, or in another workspace (the same answer)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    patch:
      summary: Partial update with optimistic concurrency (owner, admin, member). Send `expectedUpdatedAt` as last seen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt:
                  {
                    type: string,
                    format: date-time,
                    description: "The `updatedAt` last seen, exactly as returned.",
                  }
                type: { type: string, enum: [person, company] }
                displayName: { type: string, minLength: 2, maxLength: 120 }
                companyName: { type: [string, "null"], maxLength: 120 }
                email: { type: [string, "null"] }
                phone: { type: [string, "null"], maxLength: 40 }
                website: { type: [string, "null"], maxLength: 255 }
                status: { type: string, enum: [lead, active, inactive] }
                source: { type: string, enum: [referral, website, outbound, other] }
                tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
                notes: { type: [string, "null"], maxLength: 5000 }
                assignedTo: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The customer (unchanged and unwritten when the patch changes nothing). `meta.warnings` may hold `DUPLICATE_EMAIL`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Customer" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: "A viewer, an expired demo (`DEMO_EXPIRED`) or another origin",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "404":
          {
            description: "Missing, or in another workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "409": { $ref: "#/components/responses/StaleEdit" }
        "422":
          {
            description: "Validation failed, or the assignee is not a member of this workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    delete:
      summary: Archive (soft delete), idempotent. Nothing is hard-deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Archived (or already archived) }
        "400":
          {
            description: "The id is not a valid UUID",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: "A viewer, or an expired demo (`DEMO_EXPIRED`)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "404":
          {
            description: "Missing, or in another workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /customers/{id}/restore:
    post:
      summary: Restore an archived customer (owner, admin, member). Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The customer, active
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Customer" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: "A viewer, or an expired demo (`DEMO_EXPIRED`)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "404":
          {
            description: "Missing, or in another workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /organizations:
    get:
      summary: "The caller's workspaces (RLS hides every other tenant)"
      responses:
        "200":
          description: Workspaces, with `meta.total`
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Create a real workspace (registered users only; calls create_real_organization)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganization" }
      responses:
        "201":
          description: The new workspace; the caller is its owner
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Workspace" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A guest (`ACCOUNT_REQUIRED`) or a request from another origin (`ORIGIN_FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation failed; `error.fieldErrors` names the fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The per-user workspace limit was reached (`ORG_LIMIT`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /organizations/{id}:
    get:
      summary: One workspace the caller belongs to
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "The workspace, with the caller's role. An expired demo is still readable (`expired: true`)."
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/OrganizationDetail" }
                  meta: { type: object }
        "400":
          description: The id is not a UUID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found, or not a member. The two are indistinguishable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /opportunities:
    get:
      summary: One page of the workspace's opportunities (archived hidden by default), with per-stage totals for the whole filtered set
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
            description: "Over 100 is a 422, never clamped.",
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [updated_at, created_at, title, amount_cents, expected_close_date, stage],
                default: updated_at,
              },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: "Partial, case-insensitive match on the deal title and the customer's name, company or e-mail. Treated literally.",
          }
        - {
            name: stage,
            in: query,
            schema: { type: string, enum: [new, qualified, proposal, negotiation, won, lost] },
          }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - {
            name: closeFrom,
            in: query,
            schema: { type: string, format: date },
            description: "Expected close date on or after.",
          }
        - {
            name: closeTo,
            in: query,
            schema: { type: string, format: date },
            description: "Expected close date on or before.",
          }
        - {
            name: archived,
            in: query,
            schema: { type: string, enum: ["false", "true", all], default: "false" },
          }
      responses:
        "200":
          description: Opportunities. `meta` has `page`, `limit`, `total`, `totalPages` and, for the whole filtered set, `stageTotals` (count and cents for every stage), `openPipelineCents`, `weightedPipelineCents` and `aggregatesComplete`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
                      stageTotals:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            count: { type: integer }
                            amountCents: { type: integer }
                      openPipelineCents: { type: integer }
                      weightedPipelineCents: { type: integer }
                      aggregatesComplete: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          {
            description: "The workspace is not one the caller belongs to",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "422":
          {
            description: "An invalid or unknown query parameter; `error.fieldErrors` names it",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    post:
      summary: Create an opportunity in an open stage (owner, admin and member)
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOpportunity" }
      responses:
        "201":
          description: The created opportunity. The probability defaults from the stage unless sent.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Opportunity" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: "A viewer (`FORBIDDEN`), an expired demo (`DEMO_EXPIRED`) or another origin",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "404":
          {
            description: "The workspace is not one the caller belongs to, or the customer is not in it (`CUSTOMER_NOT_FOUND`)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "422":
          {
            description: "Validation failed (`fieldErrors`), or the assignee is not a member of this workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "429":
          {
            description: "The demo workspace is at its opportunity cap (`DEMO_CAP`)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /opportunities/{id}:
    get:
      summary: One opportunity with its customer's name
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The opportunity
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Opportunity" }
                  meta: { type: object }
        "400":
          {
            description: "The id is not a valid UUID",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          {
            description: "Missing, or in another workspace (the same answer)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    patch:
      summary: Partial update with optimistic concurrency (owner, admin, member). Send `expectedUpdatedAt` as last seen. `stage` is refused; use the stage endpoint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt:
                  {
                    type: string,
                    format: date-time,
                    description: "The `updatedAt` last seen, exactly as returned.",
                  }
                customerId: { type: string, format: uuid }
                title: { type: string, minLength: 2, maxLength: 150 }
                description: { type: [string, "null"], maxLength: 5000 }
                amountCents: { type: integer, minimum: 0, maximum: 100000000000 }
                probabilityPercent: { type: integer, minimum: 0, maximum: 100 }
                expectedCloseDate: { type: [string, "null"], format: date }
                assignedTo: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The opportunity (unchanged and unwritten when the patch changes nothing)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Opportunity" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: "A viewer, an expired demo (`DEMO_EXPIRED`) or another origin",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "404":
          {
            description: "Missing, or in another workspace; also a new customer that is not in this workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "409": { $ref: "#/components/responses/StaleEdit" }
        "422":
          {
            description: "Validation failed, `stage` was sent (change it with the stage endpoint), or the assignee is not a member of this workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    delete:
      summary: Archive (soft delete), idempotent. Nothing is hard-deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Archived (or already archived) }
        "400":
          {
            description: "The id is not a valid UUID",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: "A viewer, or an expired demo (`DEMO_EXPIRED`)",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "404":
          {
            description: "Missing, or in another workspace",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }

  /opportunities/{id}/stage:
    post:
      summary: Move an opportunity to another stage (owner, admin, member). The only way to change a stage.
      description: One transaction in the database function `move_opportunity_stage`. Won and lost set `closedAt`; lost requires `lostReason` (1 to 500 characters); reopening clears both; the probability resets to the stage's default; one `stage_changed` activity event is written. Moving to the current stage changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stage, expectedUpdatedAt]
              properties:
                stage: { type: string, enum: [new, qualified, proposal, negotiation, won, lost] }
                lostReason:
                  {
                    type: [string, "null"],
                    maxLength: 500,
                    description: "Required when stage is lost; ignored otherwise.",
                  }
                expectedUpdatedAt:
                  {
                    type: string,
                    format: date-time,
                    description: "The `updatedAt` last seen, exactly as returned.",
                  }
      responses:
        "200":
          description: The opportunity in its new stage (unchanged when it was already there)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Opportunity" }
                  meta: { type: object }
        "400":
          description: "The id is not a valid UUID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A viewer, an expired demo (`DEMO_EXPIRED`) or another origin"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing, or in another workspace (the same answer)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/StaleEdit" }
        "422":
          description: "Lost without a reason (`LOST_REASON_REQUIRED`), a reason over 500 characters (`LOST_REASON_TOO_LONG`), or an unknown stage"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /tasks:
    get:
      summary: One page of the workspace's tasks (archived hidden by default)
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
            description: "Over 100 is a 422, never clamped.",
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [due_date, priority, created_at, updated_at, title],
                default: due_date,
              },
            description: "Priority sorts by rank (urgent, high, medium, low; descending puts urgent first). Tasks without a due date sort last.",
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: "Partial, case-insensitive match on the title. Treated literally.",
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [todo, in_progress, blocked, done] },
          }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, urgent] } }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - { name: assignedToMe, in: query, schema: { type: string, enum: ["true", "false"] } }
        - {
            name: overdue,
            in: query,
            schema: { type: string, enum: ["true", "false"] },
            description: "`true`: not done and due before today in the ORGANIZATION's time zone. A task due today is not overdue.",
          }
        - {
            name: dueSoon,
            in: query,
            schema: { type: string, enum: ["true", "false"] },
            description: "`true`: not done and due from today through today + 7 days (both included) in the ORGANIZATION's time zone.",
          }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: opportunityId, in: query, schema: { type: string, format: uuid } }
        - {
            name: archived,
            in: query,
            schema: { type: string, enum: ["false", "true", all], default: "false" },
          }
      responses:
        "200":
          description: Tasks with `meta.page`, `limit`, `total`, `totalPages`. Each task carries `dueState` in the organization's time zone.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "The workspace is not one the caller belongs to"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "An invalid or unknown query parameter; `error.fieldErrors` names it"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      summary: Create a task (owner, admin and member)
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTask" }
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A viewer, an expired demo (`DEMO_EXPIRED`) or another origin"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "The workspace is not one the caller belongs to, or the customer or opportunity is not in it"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Validation failed, or the assignee is not a member of this workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "The demo workspace is at its task cap (`DEMO_CAP`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /tasks/{id}:
    get:
      summary: One task with its linked customer's name and deal's title
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { type: object }
        "400":
          description: "The id is not a valid UUID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "Missing, or in another workspace (the same answer)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    patch:
      summary: Partial update with optimistic concurrency (owner, admin, member). Send `expectedUpdatedAt` as last seen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt:
                  {
                    type: string,
                    format: date-time,
                    description: "The `updatedAt` last seen, exactly as returned.",
                  }
                title: { type: string, minLength: 2, maxLength: 160 }
                description: { type: [string, "null"], maxLength: 5000 }
                status: { type: string, enum: [todo, in_progress, blocked, done] }
                priority: { type: string, enum: [low, medium, high, urgent] }
                dueDate: { type: [string, "null"], format: date }
                assignedTo: { type: [string, "null"], format: uuid }
                customerId: { type: [string, "null"], format: uuid }
                opportunityId: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The task (unchanged and unwritten when the patch changes nothing)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A viewer, an expired demo (`DEMO_EXPIRED`) or another origin"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing, or in another workspace; also a linked record that is not in this workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/StaleEdit" }
        "422":
          description: "Validation failed, or the assignee is not a member of this workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Archive (soft delete), idempotent. Nothing is hard-deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Archived (or already archived) }
        "400":
          description: "The id is not a valid UUID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A viewer, or an expired demo (`DEMO_EXPIRED`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing, or in another workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /tasks/{id}/complete:
    post:
      summary: Complete or reopen a task (owner, admin, member)
      description: Completing sets status `done` and stamps `completedAt`; reopening clears it and returns the task to `todo` unless `status` says otherwise. Asking for the state the task is already in is a 200 that changes and logs nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [completed, expectedUpdatedAt]
              properties:
                completed: { type: boolean }
                status:
                  {
                    type: string,
                    enum: [todo, in_progress, blocked],
                    description: "Where a reopened task goes. Default todo.",
                  }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Task" }
                  meta: { type: object }
        "400":
          description: "The id is not a valid UUID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A viewer, an expired demo (`DEMO_EXPIRED`) or another origin"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing, or in another workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/StaleEdit" }
        "422":
          description: "Validation failed"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /members:
    get:
      summary: The members of the active workspace (id, role, display name) for owner and assignee pickers
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Members sorted by display name. Nothing else about a person is returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [userId, role, displayName, joinedAt]
                      properties:
                        userId: { type: string, format: uuid }
                        role: { type: string, enum: [owner, admin, member, viewer] }
                        displayName: { type: string }
                        joinedAt: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "The workspace is not one the caller belongs to"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /members/{userId}:
    patch:
      summary: Change a member's role (owner and admin only)
      description: >
        An admin cannot make an owner, change or remove an owner, or promote themselves (403 `OWNER_GRANT` or
        `OWNER_PROTECTED`). The last owner cannot be demoted (409 `LAST_OWNER`), also under concurrent requests. Members,
        viewers and demo guests get 403. A person who is not a member, and anyone outside the workspace, get 404.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        "200":
          description: The member's new role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId: { type: string, format: uuid }
                      role: { type: string }
        "403":
          description: "Not allowed (FORBIDDEN, OWNER_GRANT, OWNER_PROTECTED, DEMO_RESTRICTED)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Not a member, or the workspace is not the caller's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "LAST_OWNER"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Unknown role"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remove a member (owner and admin only)
      description: Same rules as the role change. The last owner cannot be removed (409 `LAST_OWNER`).
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Removed }
        "403":
          description: "Not allowed"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Not a member"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "LAST_OWNER"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /invitations:
    get:
      summary: Open invitations of the active workspace (owner and admin only)
      description: Metadata only. A token or its hash is never returned.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Invitations, newest first. `expired` is true after the 7 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string }
                        role: { type: string, enum: [admin, member, viewer] }
                        invitedBy: { type: string, format: uuid, nullable: true }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        expired: { type: boolean }
        "403":
          description: "Not allowed (members, viewers, demo guests)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      summary: Invite an address as admin, member or viewer (owner and admin only)
      description: >
        The 201 response is the only place the plaintext `token` and the `link` appear; only a hash is stored, so it cannot
        be shown again. The link carries the token in the URL fragment. 409 `ALREADY_MEMBER`, or an open invitation
        already exists for the address; 429 when the workspace has 100 open invitations. Demo workspaces are 403.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, member, viewer] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      role: { type: string }
                      expiresAt: { type: string, format: date-time }
                      token: { type: string }
                      link: { type: string }
        "403":
          description: "Not allowed"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Not the caller's workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "ALREADY_MEMBER or an open invitation exists"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Bad email, or the owner role"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "Too many open invitations"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /invitations/{id}:
    delete:
      summary: Withdraw an open invitation (owner and admin only; a documented addition to the endpoint inventory)
      description: Idempotent. An accepted invitation cannot be withdrawn (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Withdrawn }
        "403":
          description: "Not allowed"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Not found in this workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "Already accepted"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /invitations/accept:
    post:
      summary: Join the workspace an invitation names
      description: >
        Requires a signed-in user with a confirmed email equal to the invited address; no `X-Organization-Id` is needed.
        Refusals have stable codes: 404 `INVITATION_INVALID`; 409 `INVITATION_REVOKED`, `INVITATION_USED`,
        `INVITATION_EXPIRED`; 403 `EMAIL_UNVERIFIED`, `EMAIL_MISMATCH`, `ACCOUNT_REQUIRED` (a demo guest); 429
        `RATE_LIMITED` (10 attempts in 15 minutes, failures included).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organizationId: { type: string, format: uuid }
                      role: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "EMAIL_UNVERIFIED, EMAIL_MISMATCH or ACCOUNT_REQUIRED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "INVITATION_INVALID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "INVITATION_REVOKED, INVITATION_USED or INVITATION_EXPIRED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "RATE_LIMITED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /invitations/preview:
    post:
      summary: What an invitation offers, before it is accepted (a documented addition to the endpoint inventory)
      description: >
        For the confirmation page. Requires a signed-in registered user; no `X-Organization-Id`. Returns the workspace name,
        the role, the expiry, a masked form of the invited address (first letter and domain) and whether the signed-in account
        is verified and is the invited one. The token is in the body, never the URL, and is not echoed. Refusals use the same
        codes as accept (404 `INVITATION_INVALID`; 409 `INVITATION_REVOKED`, `INVITATION_USED`, `INVITATION_EXPIRED`; 429
        `RATE_LIMITED`); each lookup counts against the same 10-per-15-minutes limit. A demo guest gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organizationName: { type: string }
                      role: { type: string, enum: [admin, member, viewer] }
                      expiresAt: { type: string, format: date-time }
                      invitedEmailHint: { type: string }
                      emailVerified: { type: boolean }
                      emailMatches: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A demo guest (ACCOUNT_REQUIRED)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "INVITATION_INVALID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "INVITATION_REVOKED, INVITATION_USED or INVITATION_EXPIRED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "RATE_LIMITED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /imports/customers/preview:
    post:
      summary: Validate a customers CSV before anything is imported (US-10)
      description: >
        Parses and validates every row with the same rules as `POST /customers` and writes no customer. Stores the preview as an
        import job (counts and error row numbers / field names / codes only, never cell contents) that expires after one hour.
        The file travels as base64 in a JSON body (all mutations are JSON). Limits: 2 MB of file (413 `PAYLOAD_TOO_LARGE`),
        1,000 data rows (422 `IMPORT_TOO_MANY_ROWS`), strict UTF-8 (422 `IMPORT_NOT_UTF8`); a byte-order mark, CRLF, quoted commas
        and embedded newlines are handled. Other whole-file refusals are 422 `IMPORT_EMPTY_FILE`, `IMPORT_NO_DATA_ROWS`,
        `IMPORT_MISSING_COLUMN` (a `display_name` or `name` column is required), `IMPORT_DUPLICATE_COLUMN`, `IMPORT_NOT_CSV`,
        `IMPORT_TOO_MANY_COLUMNS` and `IMPORT_CELL_TOO_LONG`. Row numbers are spreadsheet rows (the header is row 1). Unknown columns
        are listed in `columns.unknown`. A duplicate e-mail (in the file, or already in the workspace) is a warning, never an error.
        Uploading the same file (same SHA-256) in the same workspace within the hour returns the same job with 200 instead of 201.
        Cells that start with `=`, `+`, `-` or `@` are stored as plain text (the export neutralizes them). Owner, admin and member only
        (a viewer gets 403); disabled with `NEXT_PUBLIC_ENABLE_CSV_IMPORT=false` (404). In a demo workspace `demo` reports how many more
        customers fit under the demo cap and whether this file would exceed it.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  {
                    type: string,
                    description: "The CSV file's bytes, base64 encoded (at most 2 MB of file).",
                  }
      responses:
        "200":
          description: The same file was already previewed (or imported) here within the hour; this is that job
          content:
            { application/json: { schema: { $ref: "#/components/schemas/ImportPreviewResponse" } } }
        "201":
          description: A new preview job
          content:
            { application/json: { schema: { $ref: "#/components/schemas/ImportPreviewResponse" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "A viewer, or an expired demo"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Not a member of that workspace, or the feature is off"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: "PAYLOAD_TOO_LARGE: over 2 MB"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "A file that cannot be previewed (see the codes above) or a malformed body"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "DEMO_CAP: a demo workspace already holds the most import jobs"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /quotes:
    get:
      summary: "One page of the workspace's quotes (404 when NEXT_PUBLIC_ENABLE_QUOTES is false)"
      description: >
        `page`, `limit` (default 25, at most 100; more is 422), `sort` (`updated_at` default, `created_at`, `quote_number`, `title`,
        `total_cents`, `issue_date`, `status`), `order`; filters `q` (quote number or title), `status`, `customerId`, `opportunityId`,
        `issueFrom`, `issueTo`, `archived` (`false` default, `true`, `all`). Any member, viewers included, can read. The list carries
        no line items.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [updated_at, created_at, quote_number, title, total_cents, issue_date, status],
              },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [draft, sent, approved, rejected, expired] },
          }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: opportunityId, in: query, schema: { type: string, format: uuid } }
        - { name: issueFrom, in: query, schema: { type: string, format: date } }
        - { name: issueTo, in: query, schema: { type: string, format: date } }
        - { name: archived, in: query, schema: { type: string, enum: ["false", "true", all] } }
      responses:
        "200":
          description: A page of quotes with `meta.page`, `limit`, `total`, `totalPages`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Quote" } }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "The workspace is not the caller's, or the quotes feature is off"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "A filter, sort or page value is not valid"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      summary: Create a draft quote from a customer, header fields and 1 to 100 line items
      description: >
        The server computes every amount (`subtotal = sum of quantity x unit price`, `taxable = subtotal - discount`,
        `tax = half-up(taxable x taxRateBps / 10000)`, `total = taxable + tax`) and allocates the next number (`Q-` and 6 or more
        digits, sequential per workspace). A body that names `totalCents`, `subtotalCents`, `taxCents`, `quoteNumber`, `status`,
        `version` or any other unknown field is 422. Owner, admin and member (and a demo guest in their own demo); a viewer is 403.
        An `Idempotency-Key` makes a retry return the original quote.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuote" }
      responses:
        "201":
          description: The new draft with its lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QuoteDetail" }
        "403":
          description: "A viewer, or a demo workspace that has expired (DEMO_EXPIRED)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "The workspace is not the caller's, or the feature is off"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Validation failed (fieldErrors), or a rule: DISCOUNT_TOO_LARGE, CUSTOMER_NOT_FOUND, CUSTOMER_ARCHIVED, OPPORTUNITY_MISMATCH, QUOTE_TOO_LARGE, IDEMPOTENCY_KEY_REUSED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "The demo workspace has reached its quote cap (DEMO_CAP)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /quotes/{id}:
    get:
      summary: A quote with its lines, the quote it revises, its revisions and its status history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QuoteDetail" }
        "400":
          description: "A malformed id"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing, in another workspace, or the feature is off"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    patch:
      summary: Edit a DRAFT quote at the version the client saw
      description: >
        Any of the create fields may be sent; those not sent keep their value. `items`, when sent, replaces all lines (in the order
        given). Totals are recomputed by the server. A stale `expectedVersion` is 409 `STALE_EDIT` with `error.meta.current.version`;
        a quote that has been sent is 409 `QUOTE_LOCKED` (revise it instead). Totals, number and status in the body are 422.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuote" }
      responses:
        "200":
          description: The updated quote (version + 1)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QuoteDetail" }
        "403":
          description: "A viewer"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing or in another workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "STALE_EDIT or QUOTE_LOCKED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Validation failed or a rule (see POST)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /quotes/{id}/transition:
    post:
      summary: Move a quote along draft -> sent -> approved | rejected | expired
      description: >
        Allowed: draft to sent (needs at least one line), sent to approved, rejected or expired. Anything else is 409
        `QUOTE_STATUS_TRANSITION`. `expectedVersion` is optional (the current version is used without it); a stale one is 409
        `STALE_EDIT`. In a demo workspace "sent" only changes the status: nothing is delivered anywhere.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { type: string, enum: [sent, approved, rejected, expired] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The quote in its new status (version + 1)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QuoteDetail" }
        "403":
          description: "A viewer"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing or in another workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "QUOTE_STATUS_TRANSITION or STALE_EDIT"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "An unknown target, or ITEMS_REQUIRED when sending a quote with no lines"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /quotes/{id}/revise:
    post:
      summary: Start a new draft from a quote that has been sent
      description: >
        The new draft gets the next number, version 1 and `revisesQuoteId`; its lines and amounts are copied. The original is left
        exactly as it was. A draft cannot be revised (409 `QUOTE_NOT_REVISABLE`); one open draft revision per quote (409
        `REVISION_EXISTS`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "201":
          description: The new draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QuoteDetail" }
        "403":
          description: "A viewer"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "Missing or in another workspace"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "QUOTE_NOT_REVISABLE or REVISION_EXISTS"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /dashboard:
    get:
      summary: The active workspace's current-state KPIs and its 10 newest activity events
      description: >
        Every number is a count or sum of stored, unarchived records as of `generatedAt` (`basis` is `current_state`):
        no trends, no estimates. Computed by the database with the caller's own session, so another workspace's rows can
        never be counted. `overdueTasks` and `tasksDueNext7Days` use the organization's local date (`today`, in
        `timeZone`): a task due today is not overdue, and "next 7 days" runs from today through today + 7, both included.
        Done tasks are excluded. `weightedPipelineCents` rounds each open deal half up before summing. Any member,
        viewers included, can read it.
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required:
                      - basis
                      - generatedAt
                      - today
                      - timeZone
                      - activeCustomers
                      - openOpportunities
                      - pipelineCents
                      - weightedPipelineCents
                      - overdueTasks
                      - tasksDueNext7Days
                      - opportunitiesByStage
                      - recentActivity
                    properties:
                      basis: { type: string, enum: [current_state] }
                      generatedAt: { type: string, format: date-time }
                      today:
                        { type: string, format: date, description: "The organization's local date" }
                      timeZone: { type: string, description: IANA zone of the organization }
                      activeCustomers: { type: integer }
                      openOpportunities: { type: integer }
                      pipelineCents:
                        {
                          type: integer,
                          description: "Sum of amounts in new, qualified, proposal and negotiation",
                        }
                      weightedPipelineCents: { type: integer }
                      overdueTasks: { type: integer }
                      tasksDueNext7Days: { type: integer }
                      opportunitiesByStage:
                        type: object
                        description: Every stage is present, empty ones as zero
                        additionalProperties:
                          type: object
                          required: [count, amountCents]
                          properties:
                            count: { type: integer }
                            amountCents: { type: integer }
                      recentActivity:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          required:
                            [
                              id,
                              entityType,
                              entityId,
                              action,
                              summary,
                              actorUserId,
                              createdAt,
                              changes,
                              contentChanged,
                            ]
                          properties:
                            id: { type: string, format: uuid }
                            entityType: { type: string, enum: [customer, opportunity, task, quote] }
                            entityId: { type: string, format: uuid }
                            action: { type: string }
                            summary: { type: string }
                            actorUserId: { type: string, format: uuid, nullable: true }
                            createdAt: { type: string, format: date-time }
                            changes: { type: array, items: { type: object } }
                            contentChanged: { type: array, items: { type: string } }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "The workspace is not one the caller belongs to"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /activity:
    get:
      summary: One page of the workspace's activity feed, newest first
      description: >
        Any member (viewers included) can read it. Events of other workspaces are never returned. `actorName` is `System`
        for automatic events, the member's display name, or `Former member` for a person who is no longer in the
        workspace. `changes` holds only whitelisted plain fields (old and new); free-text fields appear by name in
        `contentChanged`, never with their content. `from` and `to` are inclusive calendar days in the organization's time
        zone. Ordering is by time, then id, so pages never repeat or skip an event.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [created_at], default: created_at },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - {
            name: entityType,
            in: query,
            schema: { type: string, enum: [customer, opportunity, task, quote] },
          }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - {
            name: action,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    created,
                    updated,
                    archived,
                    restored,
                    deleted,
                    stage_changed,
                    completed,
                    reopened,
                    sent,
                    approved,
                    rejected,
                    imported,
                  ],
              },
          }
        - {
            name: actor,
            in: query,
            description: A member's user id,
            or `system` for automatic events,
            schema: { type: string },
          }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: A page of events with the standard pagination meta
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          entityType,
                          entityId,
                          action,
                          summary,
                          actorUserId,
                          actorName,
                          changes,
                          contentChanged,
                          createdAt,
                        ]
                      properties:
                        id: { type: string, format: uuid }
                        entityType: { type: string, enum: [customer, opportunity, task, quote] }
                        entityId: { type: string, format: uuid }
                        entityState:
                          {
                            type: string,
                            enum: [active, archived, missing],
                            description: "Where the record stands inside this workspace: link it unless `missing`; show `archived` as archived",
                          }
                        action: { type: string }
                        summary: { type: string }
                        actorUserId: { type: string, format: uuid, nullable: true }
                        actorName: { type: string }
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              field: { type: string }
                              old: {}
                              new: {}
                        contentChanged: { type: array, items: { type: string } }
                        createdAt: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "The workspace is not one the caller belongs to"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Invalid parameter (field errors keyed by parameter name)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: One key per user intent (8-128 of A-Z a-z 0-9 _ -). Reuse it on retry. Same key and payload replays the stored result; a different payload is 422 IDEMPOTENCY_KEY_REUSED; a duplicate still running is 409 IDEMPOTENCY_IN_PROGRESS.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9_-]{8,128}$" }
  responses:
    StaleEdit:
      description: The record changed since the client loaded it (code STALE_EDIT). `error.meta.current` holds the current `updatedAt` (and `version`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    QuoteItemInput:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPriceCents]
      properties:
        description: { type: string, minLength: 2, maxLength: 300 }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
    CreateQuote:
      type: object
      additionalProperties: false
      required: [customerId, title, items]
      properties:
        customerId: { type: string, format: uuid }
        opportunityId:
          {
            type: [string, "null"],
            format: uuid,
            description: "Must be a deal of the same customer.",
          }
        title: { type: string, minLength: 2, maxLength: 150 }
        issueDate:
          {
            type: [string, "null"],
            format: date,
            description: "Defaults to today in the workspace's time zone.",
          }
        validUntil: { type: [string, "null"], format: date }
        taxRateBps:
          {
            type: integer,
            minimum: 0,
            maximum: 10000,
            default: 0,
            description: "Basis points: 825 is 8.25%.",
          }
        discountCents: { type: integer, minimum: 0, default: 0 }
        notes: { type: [string, "null"], maxLength: 5000 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { $ref: "#/components/schemas/QuoteItemInput" },
          }
    UpdateQuote:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        customerId: { type: string, format: uuid }
        opportunityId: { type: [string, "null"], format: uuid }
        title: { type: string, minLength: 2, maxLength: 150 }
        issueDate: { type: string, format: date }
        validUntil: { type: [string, "null"], format: date }
        taxRateBps: { type: integer, minimum: 0, maximum: 10000 }
        discountCents: { type: integer, minimum: 0 }
        notes: { type: [string, "null"], maxLength: 5000 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { $ref: "#/components/schemas/QuoteItemInput" },
          }
    ImportPreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            importJobId: { type: string, format: uuid }
            status: { type: string, enum: [previewed, committed, failed, expired] }
            fileSha256: { type: string }
            expiresAt: { type: string, format: date-time }
            counts:
              type: object
              properties:
                total: { type: integer }
                valid: { type: integer }
                invalid: { type: integer }
            columns:
              type: object
              properties:
                mapped:
                  type: array
                  items:
                    type: object
                    properties:
                      header: { type: string }
                      field: { type: string }
                unknown: { type: array, items: { type: string } }
            rows:
              type: array
              description: The first 20 data rows
              items:
                type: object
                properties:
                  row: { type: integer }
                  valid: { type: boolean }
                  values: { type: object, additionalProperties: { type: string } }
                  errors: { type: array, items: { $ref: "#/components/schemas/ImportRowIssue" } }
                  warnings: { type: array, items: { $ref: "#/components/schemas/ImportRowIssue" } }
            errors: { type: array, items: { $ref: "#/components/schemas/ImportRowIssue" } }
            errorsTruncated:
              {
                type: boolean,
                description: "True when more than 500 errors exist; the counts are always complete",
              }
            warnings: { type: array, items: { $ref: "#/components/schemas/ImportRowIssue" } }
            warningsTruncated: { type: boolean }
            demo:
              nullable: true
              type: object
              properties:
                remaining: { type: integer }
                wouldExceed: { type: boolean }
    ImportRowIssue:
      type: object
      properties:
        row: { type: integer, description: "Spreadsheet row; the header is row 1" }
        field: { type: string, nullable: true }
        code: { type: string }
        message: { type: string }
        firstRow:
          {
            type: integer,
            description: "For DUPLICATE_IN_FILE: the earlier row with the same e-mail",
          }
    Quote:
      type: object
      required:
        [
          id,
          quoteNumber,
          customerId,
          title,
          currency,
          status,
          issueDate,
          taxRateBps,
          discountCents,
          subtotalCents,
          taxCents,
          totalCents,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        quoteNumber: { type: string, pattern: "^Q-[0-9]{6,}$" }
        customerId: { type: string, format: uuid }
        customerName: { type: [string, "null"] }
        opportunityId: { type: [string, "null"], format: uuid }
        title: { type: string }
        currency: { type: string, enum: [USD] }
        status: { type: string, enum: [draft, sent, approved, rejected, expired] }
        issueDate: { type: string, format: date }
        validUntil: { type: [string, "null"], format: date }
        taxRateBps: { type: integer }
        discountCents: { type: integer }
        subtotalCents: { type: integer, description: "Computed by the server." }
        taxCents: { type: integer, description: "Computed by the server." }
        totalCents: { type: integer, description: "Computed by the server." }
        notes: { type: [string, "null"] }
        version: { type: integer, description: "Send it back as `expectedVersion`." }
        revisesQuoteId: { type: [string, "null"], format: uuid }
        createdBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    QuoteDetail:
      allOf:
        - $ref: "#/components/schemas/Quote"
        - type: object
          required: [items, revises, revisions, statusHistory]
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  position: { type: integer }
                  description: { type: string }
                  quantity: { type: integer }
                  unitPriceCents: { type: integer }
                  lineTotalCents: { type: integer }
            revises:
              type: [object, "null"]
              description: The quote this one revises.
              properties:
                id: { type: string, format: uuid }
                quoteNumber: { type: string }
                status: { type: string }
            revisions:
              type: array
              description: The revisions made from this quote, newest first.
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  quoteNumber: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
            statusHistory:
              type: array
              description: Draft at creation, then each status change, oldest first.
              items:
                type: object
                properties:
                  status: { type: string }
                  at: { type: string, format: date-time }
    Customer:
      type: object
      required: [id, type, displayName, status, source, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [person, company] }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        companyName: { type: [string, "null"], maxLength: 120 }
        email: { type: [string, "null"], format: email, description: "Trimmed and lower-case." }
        phone: { type: [string, "null"], maxLength: 40 }
        website: { type: [string, "null"], description: "http or https only." }
        status: { type: string, enum: [lead, active, inactive] }
        source: { type: string, enum: [referral, website, outbound, other] }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
        notes: { type: [string, "null"], maxLength: 5000 }
        assignedTo: { type: [string, "null"], format: uuid }
        createdBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    CreateCustomer:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        type: { type: string, enum: [person, company], default: person }
        displayName: { type: string, minLength: 2, maxLength: 120 }
        companyName: { type: [string, "null"], maxLength: 120 }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"], maxLength: 40 }
        website: { type: [string, "null"], maxLength: 255 }
        status: { type: string, enum: [lead, active, inactive], default: lead }
        source: { type: string, enum: [referral, website, outbound, other], default: other }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
        notes: { type: [string, "null"], maxLength: 5000 }
        assignedTo: { type: [string, "null"], format: uuid }
    Opportunity:
      type: object
      required:
        [id, customerId, title, stage, amountCents, probabilityPercent, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: [string, "null"] }
        title: { type: string, minLength: 2, maxLength: 150 }
        description: { type: [string, "null"], maxLength: 5000 }
        stage: { type: string, enum: [new, qualified, proposal, negotiation, won, lost] }
        amountCents: { type: integer, minimum: 0, description: "Whole cents, never a float." }
        probabilityPercent: { type: integer, minimum: 0, maximum: 100 }
        expectedCloseDate: { type: [string, "null"], format: date }
        assignedTo: { type: [string, "null"], format: uuid }
        lostReason: { type: [string, "null"], maxLength: 500 }
        closedAt: { type: [string, "null"], format: date-time }
        createdBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    CreateOpportunity:
      type: object
      additionalProperties: false
      required: [customerId, title]
      properties:
        customerId: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 150 }
        description: { type: [string, "null"], maxLength: 5000 }
        stage:
          {
            type: string,
            enum: [new, qualified, proposal, negotiation],
            default: new,
            description: "Won and lost are set through the stage endpoint.",
          }
        amountCents: { type: integer, minimum: 0, maximum: 100000000000, default: 0 }
        probabilityPercent:
          { type: integer, minimum: 0, maximum: 100, description: "Defaults from the stage." }
        expectedCloseDate: { type: [string, "null"], format: date }
        assignedTo: { type: [string, "null"], format: uuid }
    Task:
      type: object
      required: [id, title, status, priority, dueState, dueToday, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 5000 }
        status: { type: string, enum: [todo, in_progress, blocked, done] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        dueDate: { type: [string, "null"], format: date }
        dueState:
          {
            type: string,
            enum: [none, done, overdue, due_soon, later],
            description: "In the organization's time zone.",
          }
        assignedTo: { type: [string, "null"], format: uuid }
        customerId: { type: [string, "null"], format: uuid }
        customerName: { type: [string, "null"] }
        opportunityId: { type: [string, "null"], format: uuid }
        opportunityTitle: { type: [string, "null"] }
        completedAt:
          {
            type: [string, "null"],
            format: date-time,
            description: "Set by the database exactly when the status is done.",
          }
        createdBy: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 5000 }
        status: { type: string, enum: [todo, in_progress, blocked, done], default: todo }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        dueDate: { type: [string, "null"], format: date }
        assignedTo: { type: [string, "null"], format: uuid }
        customerId: { type: [string, "null"], format: uuid }
        opportunityId: { type: [string, "null"], format: uuid }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            meta:
              type: object
              additionalProperties: true
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    Workspace:
      type: object
      required: [id, name, kind, role, timezone, expiresAt, secondsRemaining, expired]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [real, demo] }
        role: { type: string, enum: [owner, admin, member, viewer] }
        timezone: { type: string }
        expiresAt: { type: [string, "null"], format: date-time, description: Demo workspaces only }
        secondsRemaining:
          { type: [integer, "null"], description: Demo workspaces only; never negative }
        expired: { type: boolean }
    OrganizationDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        industry: { type: [string, "null"] }
        timezone: { type: string }
        currency: { type: string, enum: [USD] }
        kind: { type: string, enum: [real, demo] }
        role: { type: string, enum: [owner, admin, member, viewer] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        secondsRemaining: { type: [integer, "null"] }
        expired: { type: boolean }
    Session:
      type: object
      required: [user, organizations, demo]
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            displayName: { type: [string, "null"] }
            email: { type: [string, "null"], description: Null for a guest }
            isAnonymous: { type: boolean }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        demo:
          type: [object, "null"]
          properties:
            organizationId: { type: string, format: uuid }
            expiresAt: { type: [string, "null"], format: date-time }
            secondsRemaining: { type: [integer, "null"] }
            expired: { type: boolean }
    CreateOrganization:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        industry: { type: [string, "null"], maxLength: 80 }
        timezone:
          {
            type: string,
            description: "UTC or an IANA Area/City name; default UTC",
            examples: [America/New_York],
          }
